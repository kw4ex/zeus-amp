# SPDX-License-Identifier: GPL-2.0-or-later
name: Build, test and package

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # only used to attach the ZIP to a tagged release

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-14]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Build
        run: dotnet build Zeus.Kpa1500.slnx -c Release --nologo
      - name: Lock file is current
        shell: bash
        run: git diff --exit-code -- src/Kpa1500/packages.lock.json
      - name: Tests (fake KPA1500 over loopback UDP, no hardware)
        shell: bash
        run: |
          set -o pipefail
          if ! dotnet run --project tests/Kpa1500.Tests -c Release --no-build 2>&1 | tee test-output.txt; then
            # Surface the end of the output (e.g. a crash message) on the run page.
            msg=$(tail -n 60 test-output.txt | sed -e 's/%/%25/g' -e 's/\r//g' | awk 'BEGIN{ORS="%0A"} {print}')
            echo "::error title=Test output tail ($RUNNER_OS)::$msg"
            exit 1
          fi

  package:
    needs: test
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Package
        shell: pwsh
        run: ./src/Kpa1500/build-package.ps1 -ManagedDependency System.IO.Ports.dll
      - name: Validate with the Zeus catalog tools
        shell: pwsh
        run: |
          $manifest = Get-Content src/Kpa1500/plugin.json -Raw | ConvertFrom-Json
          git clone --depth 1 https://github.com/Zeus-SDR/zeus-community-features "$env:RUNNER_TEMP/zeus"
          $zip = Resolve-Path "artifacts/$($manifest.id)/$($manifest.id)-$($manifest.version).zip"
          Push-Location "$env:RUNNER_TEMP/zeus"
          ./tools/validate-package.ps1 `
            -PackagePath $zip `
            -ExpectedId $manifest.id `
            -ExpectedVersion $manifest.version `
            -ExpectedSdkAbi $manifest.sdk.abi `
            -ExpectedSdkMinVersion $manifest.sdk.minVersion `
            -ManifestSchemaPath schema/plugin.schema.json
          Pop-Location
      - uses: actions/upload-artifact@v6
        with:
          name: kpa1500-package
          path: artifacts/**/*.zip*
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = Get-ChildItem artifacts -Recurse -Include *.zip,*.sha256 | ForEach-Object FullName
          $pre = @()
          if ("${{ github.ref_name }}".Contains("-")) { $pre = @("--prerelease") }
          gh release create "${{ github.ref_name }}" $files --title "${{ github.ref_name }}" --notes "Elecraft KPA1500 feature for Zeus. Download the file ending in .zip (not Source code) and install it in Zeus with Features > Community > Install local feature." @pre 2>$null
          if ($LASTEXITCODE -ne 0) { gh release upload "${{ github.ref_name }}" $files --clobber }

  package-unix:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Package (macOS Apple silicon + Intel, Linux x64 + ARM64)
        shell: pwsh
        run: ./tools/package-unix.ps1
      - name: Validate with the Zeus catalog tools
        shell: pwsh
        run: |
          $manifest = Get-Content src/Kpa1500/plugin.json -Raw | ConvertFrom-Json
          git clone --depth 1 https://github.com/Zeus-SDR/zeus-community-features "$env:RUNNER_TEMP/zeus"
          $zips = Get-ChildItem "artifacts/$($manifest.id)" -Filter "*.zip" | Where-Object { $_.Name -match '-(osx|linux)-' }
          if ($zips.Count -ne 4) { throw "expected 4 macOS/Linux packages, found $($zips.Count)" }
          Push-Location "$env:RUNNER_TEMP/zeus"
          foreach ($z in $zips) {
            ./tools/validate-package.ps1 `
              -PackagePath $z.FullName `
              -ExpectedId $manifest.id `
              -ExpectedVersion $manifest.version `
              -ExpectedSdkAbi $manifest.sdk.abi `
              -ExpectedSdkMinVersion $manifest.sdk.minVersion `
              -ManifestSchemaPath schema/plugin.schema.json
          }
          Pop-Location
      - uses: actions/upload-artifact@v6
        with:
          name: kpa1500-package-macos
          path: artifacts/**/*-osx-*.zip*
      - uses: actions/upload-artifact@v6
        with:
          name: kpa1500-package-linux
          path: artifacts/**/*-linux-*.zip*
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = Get-ChildItem artifacts -Recurse -Include *-osx-*.zip*,*-linux-*.zip* | ForEach-Object FullName
          for ($i = 0; $i -lt 10; $i++) {
            gh release view "${{ github.ref_name }}" *> $null
            if ($LASTEXITCODE -eq 0) { break }
            Start-Sleep -Seconds 30
          }
          gh release upload "${{ github.ref_name }}" $files --clobber

  load-check:
    needs: package-unix
    name: load check (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: osx-arm64,   os: macos-14,         artifact: kpa1500-package-macos }
          - { rid: linux-x64,   os: ubuntu-24.04,     artifact: kpa1500-package-linux }
          - { rid: linux-arm64, os: ubuntu-24.04-arm, artifact: kpa1500-package-linux }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - uses: actions/download-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: pkg
      - name: Load the ${{ matrix.rid }} package and its serial library on this machine
        shell: pwsh
        run: |
          $zip = Get-ChildItem pkg -Recurse -Filter "*-${{ matrix.rid }}.zip" | Select-Object -First 1
          if (-not $zip) { throw "package for ${{ matrix.rid }} not found" }
          $dir = Join-Path $env:RUNNER_TEMP "unzipped"
          Expand-Archive $zip.FullName $dir -Force
          Get-ChildItem $dir | Format-Table Name, Length
          dotnet run --project tools/LoadCheck -c Release -- $dir
